services:
  db:
    image: postgres:16-alpine
    container_name: stockflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
      POSTGRES_DB: stockflow
    ports:
      - "5432:5432"
    volumes:
      - stockflow_pgdata:/var/lib/postgresql/data

volumes:
  stockflow_pgdata:
